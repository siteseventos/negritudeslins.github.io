})();</script><script>(function(){/* ===== CONFIGURAÇÃO DA GALERIA =====   Opção A (automática): GH_REPO = "seu-usuario/nome-do-repositorio". O site lista sozinho   todas as imagens da pasta "fotos" do GitHub: basta enviar as fotos, sem mexer neste arquivo.   Opção B (manual): deixe GH_REPO vazio e escreva os nomes em FOTOS, por exemplo ["abertura.jpg","danca-01.jpg"].   ALBUM = link do álbum completo (Google Fotos ou Drive). Deixe "" para esconder o botão. */var GH_REPO="", PASTA="fotos", FOTOS=[], ALBUM="";var $=function(i){return document.getElementById(i)},L=[],cur=0;var ext=/\.(jpe?g|png|webp|gif|avif)$/i;function nome(f){return f.replace(ext,"").replace(/[-_]+/g," ")}function draw(){  var g=$("gal");g.innerHTML="";  $("gal-vazia").hidden=L.length>0;  L.forEach(function(f,i){var b=document.createElement("button");b.type="button";b.setAttribute("aria-label","Ampliar foto "+(i+1));    var im=document.createElement("img");im.loading="lazy";im.decoding="async";im.src=PASTA+"/"+encodeURI(f);im.alt="Foto "+(i+1)+" do NEGRITUDES LINS";    b.appendChild(im);b.onclick=function(){open(i)};g.appendChild(b)});}function show(){var f=L[cur];$("lb-img").src=PASTA+"/"+encodeURI(f);$("lb-img").alt="Foto "+(cur+1)+" do NEGRITUDES LINS";$("lb-c").textContent=(cur+1)+" / "+L.length;  var m=L.length<2;$("lb-p").hidden=m;$("lb-s").hidden=m}function open(i){cur=i;show();$("lb").hidden=false;document.body.style.overflow="hidden";$("lb-x").focus()}function close(){$("lb").hidden=true;$("lb-img").removeAttribute("src");document.body.style.overflow=""}function go(d){cur=(cur+d+L.length)%L.length;show()}$("lb-x").onclick=close;$("lb-p").onclick=function(){go(-1)};$("lb-s").onclick=function(){go(1)};$("lb").onclick=function(e){if(e.target===this)close()};document.addEventListener("keydown",function(e){if($("lb").hidden)return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowRight")go(1)});var x0=null;$("lb").addEventListener("touchstart",function(e){x0=e
